services:
  yue2-server:
    build:
      context: ..
      dockerfile: yue2/Dockerfile
    image: yue2-serving:latest
    container_name: yue2-serving
    ports:
      - "8008:8008"
    environment:
      - YUE2_MODEL=m-a-p/YuE2-3B
      - YUE2_VAE=m-a-p/YuE2-Vae
      - YUE2_DEVICE=auto
      - YUE2_MEMORY_BUDGET_GIB=24
      - HF_HOME=/runpod-volume/cache/huggingface
    volumes:
      # Persist downloaded weights simulating RunPod Network Volume
      - yue2-volume:/runpod-volume
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8008"]
    restart: unless-stopped
    # Uncomment deploy section below when running on host with NVIDIA GPUs
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  yue2-volume:
